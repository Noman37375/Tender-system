services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenderiq
      POSTGRES_PASSWORD: tenderiq
      POSTGRES_DB: tenderiq
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderiq -d tenderiq"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tenderiq:tenderiq@db:5432/tenderiq
      CHECKPOINT_DB_URL: postgresql://tenderiq:tenderiq@db:5432/tenderiq
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  filedata:
