[project]
name = "tenderiq-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "structlog>=24.1",
    "pymupdf>=2.1",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.6",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "langchain-openai>=1.7.4",
    "langchain-anthropic>=1.7.10",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.33",
    "filetype>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.repositories.*", "app.security.*", "app.services.*"]
strict = true

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
